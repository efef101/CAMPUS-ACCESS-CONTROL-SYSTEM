<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    :root {
      --ink: #1a2233;
      --muted: #8a93a3;
      --line: #e6e9ef;
      --gold: #f0b429;
      --green: #22c55e;
      --red: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main { width: 100%; max-width: 320px; text-align: center; }

    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .sub { margin: 0 0 32px; font-size: 14px; color: var(--muted); }

    .frame {
      width: 240px;
      max-width: 70vw;
      aspect-ratio: 3 / 4;
      margin: 0 auto;
      padding: 7px;
      border: 2px solid var(--line);
      border-radius: 50%;
      transition: border-color .25s, box-shadow .25s;
    }
    .frame.near  { border-color: var(--gold); }
    .frame.bad   { border-color: var(--red); }
    .frame.ready { border-color: var(--green); animation: pulse 1.6s ease-out infinite; }
    @keyframes pulse {
      from { box-shadow: 0 0 0 0 rgba(34,197,94,0.30); }
      to   { box-shadow: 0 0 0 16px rgba(34,197,94,0); }
    }

    video {
      display: block; width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
      background: #f4f5f8; transform: scaleX(-1);   /* mirrored for the front camera */
    }
    video.rear { transform: none; }                  /* patrol: rear camera must not be mirrored */

    #status { margin: 28px 0 0; min-height: 22px; font-size: 14px; color: var(--muted); }

    .result {
      display: none; margin-top: 18px; padding: 14px; border-radius: 12px;
      font-size: 14px; line-height: 1.5; border: 1px solid;
    }
    .result strong { display: block; font-size: 16px; margin-bottom: 2px; }
    .result.ok   { background: #e8f8ef; color: #15803d; border-color: #16a34a; }
    .result.bad  { background: #fdeaea; color: #b91c1c; border-color: var(--red); }
    .result.warn { background: #fff7e0; color: #92400e; border-color: var(--gold); }

    .btn {
      display: block; width: 100%; margin-top: 14px; padding: 12px 16px;
      background: #ffffff; color: var(--ink);
      border: 1px solid var(--line); border-radius: 12px;
      font: 500 14px "Inter", -apple-system, "Segoe UI", sans-serif;
      text-decoration: none; cursor: pointer;
      transition: transform .18s, background .18s, border-color .18s, box-shadow .18s;
    }
    .btn:hover {
      transform: translateY(-2px); background: #fffdf5; border-color: #f0b429;
      box-shadow: 0 8px 24px rgba(240,180,41,0.25);
    }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #retry { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .frame.ready { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>

<body>
<main>
  <h1>Face verification</h1>
  <p class="sub" id="sub">Look at the camera to verify.</p>

  <div class="frame" id="frame">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <p id="status">Starting camera...</p>

  <div class="result" id="result"></div>

  <button class="btn" id="retry" type="button">Try again</button>
  <a class="btn" id="backBtn" href="scanner_hw.php">Back to Scanner</a>
</main>

<script src="sounds.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

// Patrol mode: a roving guard is checking someone with the phone's rear camera.
// It never cancels gate entries/exits and returns to the patrol page afterwards.
const PATROL   = params.get("patrol") === "1";
const BACK_URL = PATROL ? "mobile_scanning.php" : "scanner_hw.php";

const video    = document.getElementById("video");
const frame    = document.getElementById("frame");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const retryBtn = document.getElementById("retry");
const backBtn  = document.getElementById("backBtn");
const subEl    = document.getElementById("sub");
const sleep = ms => new Promise(r => setTimeout(r, ms));

backBtn.href = BACK_URL;
if (PATROL) {
  backBtn.textContent = "Back to Patrol Check";
  subEl.textContent = "Point the rear camera at the person's face.";
  video.classList.add("rear");
}

// Browsers block audio until the first user interaction
["pointerdown", "keydown"].forEach(ev =>
  document.addEventListener(ev, () => { try { Sound.unlock(); } catch (e) {} }, { once: true })
);

// Safe sound call: a missing sounds.js can never break the result screen
function snd(name) {
  try { if (window.Sound && typeof Sound[name] === "function") Sound[name](); } catch (e) {}
}

const CFG = {
  minFaceRatio: 0.20,
  maxOffsetX: 0.12,       // how far the face may be off-center (fraction of video width)
  maxOffsetY: 0.15        // (fraction of video height)
};

let finished = false;

function setFrame(state) { frame.className = "frame" + (state ? " " + state : ""); }

function stopCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
}

function showResult(kind, title, text) {
  resultEl.className = "result " + kind;
  resultEl.innerHTML = "";
  const t = document.createElement("strong");
  t.textContent = title;
  resultEl.appendChild(t);
  if (text) resultEl.appendChild(document.createTextNode(text));
  resultEl.style.display = "block";
}

async function init() {
  if (!code) { statusEl.innerText = "Missing verification code."; return; }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: PATROL ? "environment" : "user" },
      audio: false
    });
    video.srcObject = stream;
  } catch (err) {
    console.error(err);
    statusEl.innerText = "Camera error: " + err.message;
    return;
  }

  statusEl.innerText = "Loading face models...";
  try {
    const MODEL_URL = "./models";
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
  } catch (err) {
    console.error("Model loading error:", err);
    statusEl.innerText = "Unable to load face models.";
    return;
  }

  statusEl.innerText = PATROL ? "Center the person's face in the frame." : "Center your face in the frame.";
  await video.play();
  verifyLoop();
}

async function verifyLoop() {
  const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
  const who = PATROL ? "the face" : "your face";

  while (!finished) {
    const det = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();
    if (finished) return;

    if (!det) {
      setFrame("");
      statusEl.innerText = "No face detected. Center " + who + " in the frame.";
      await sleep(150);
      continue;
    }

    const box = det.detection.box;

    if (box.width / video.videoWidth < CFG.minFaceRatio || det.detection.score < 0.7) {
      setFrame("near");
      statusEl.innerText = PATROL ? "Move closer and ask them to look straight at the camera."
                                  : "Move closer and look straight ahead.";
      await sleep(150);
      continue;
    }

    const offX = Math.abs(box.x + box.width / 2 - video.videoWidth / 2) / video.videoWidth;
    const offY = Math.abs(box.y + box.height / 2 - video.videoHeight / 2) / video.videoHeight;
    if (offX > CFG.maxOffsetX || offY > CFG.maxOffsetY) {
      setFrame("near");
      statusEl.innerText = "Center " + who + " inside the frame.";
      await sleep(150);
      continue;
    }

    setFrame("ready");
    statusEl.innerText = "Verifying...";

    const data = await submit(Array.from(det.descriptor));
    if (data) { finished = true; handleResult(data); return; }

    // network problem only: try again (a wrong face is answered by the server, not retried here)
    statusEl.innerText = "Connection problem. Retrying...";
    await sleep(1000);
  }
}

async function submit(descriptor) {
  try {
    const body = new URLSearchParams();
    body.append("action", "compare");
    body.append("code", code);
    body.append("face_descriptor", JSON.stringify(descriptor));
    if (PATROL) body.append("patrol", "1");

    const res = await fetch("scanner_hw.php", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });

    // Session expired: go back to login instead of retrying forever
    if (res.status === 401) { location.href = "login.php"; return { error: "Session expired. Please log in again." }; }

    return await res.json();
  } catch (err) {
    console.error("Verification error:", err);
    return null;
  }
}

function handleResult(data) {
  stopCamera();

  // error, session expired, or unexpected reply
  if (data.error || !("match" in data)) {
    snd("error");
    setFrame("near");
    statusEl.innerText = "";
    showResult("warn", "Could not verify", data.error || data.message || "Unexpected response.");
    retryBtn.style.display = "block";
    return;
  }

  // face matches, but the scan was already cancelled by an earlier failed check
  if (data.match && data.note) {
    snd("warn");
    setFrame("near");
    statusEl.innerText = "";
    showResult("warn", "Scan already cancelled", data.note);
    return;
  }

  if (data.match) {
    snd("success");
    setFrame("ready");
    statusEl.innerText = PATROL ? "Returning to patrol check..." : "Returning to scanner...";
    showResult("ok", "Face matches", data.name || "");
    setTimeout(() => { location.href = BACK_URL; }, 3000);
    return;
  }

  // no match: at the gate the server cancels the entry/exit; in patrol it only records the denial
  snd("error");
  setFrame("bad");
  statusEl.innerText = "";
  showResult("bad", "Face does NOT match", data.message || "");
  if (data.suspicious) {
    const warn = document.createElement("strong");
    warn.style.marginTop = "8px";
    warn.textContent = "REPEATED DENIAL: INVESTIGATE";
    resultEl.appendChild(warn);
  }
  if (!data.reverted) retryBtn.style.display = "block";
}

retryBtn.addEventListener("click", () => location.reload());
window.addEventListener("pagehide", () => { finished = true; stopCamera(); });

init();
</script>
</body>
</html>
